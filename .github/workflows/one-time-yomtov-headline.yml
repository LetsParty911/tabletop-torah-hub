name: One-time Yom Tov headline update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update homepage headline logic
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/routes/index.tsx')
          text = path.read_text()

          anchor = '  const displayedParshaKey = isFallback && fallbackParshaKey ? fallbackParshaKey : currentParshaKey;'
          addition = '''  const displayedParshaKey = isFallback && fallbackParshaKey ? fallbackParshaKey : currentParshaKey;
  const isYomTovCollection = new Set([
    "Rosh Hashanah",
    "Yom Kippur",
    "Sukkos",
    "Shemini Atzeres",
    "Simchas Torah",
    "Pesach",
    "Shavuos",
  ]).has(displayedLabel);'''
          if anchor not in text:
            raise SystemExit('displayedParshaKey marker not found')
          text = text.replace(anchor, addition, 1)

          old = '"Free Divrei Torah for Your Shabbos Table"'
          new = '`Free Divrei Torah for Your ${isYomTovCollection ? "Yom Tov" : "Shabbos"} Table`'
          if old not in text:
            raise SystemExit('Hero headline text not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/one-time-yomtov-headline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx .github/workflows/one-time-yomtov-headline.yml
          git commit -m "Switch homepage table wording automatically for Yom Tov"
          git push
