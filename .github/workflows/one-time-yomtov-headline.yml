name: Apply Yom Tov homepage wording
on: push
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/index.tsx')
          s = p.read_text()
          anchor = '  const displayedParshaKey = isFallback && fallbackParshaKey ? fallbackParshaKey : currentParshaKey;'
          insert = anchor + '\n  const isYomTovCollection = ["Rosh Hashanah", "Yom Kippur", "Sukkos", "Shemini Atzeres", "Simchas Torah", "Pesach", "Shavuos"].includes(displayedLabel);'
          if 'const isYomTovCollection =' not in s:
              s = s.replace(anchor, insert, 1)
          s = s.replace('"Free Divrei Torah for Your Shabbos Table"', '`Free Divrei Torah for Your ${isYomTovCollection ? "Yom Tov" : "Shabbos"} Table`', 1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          rm .github/workflows/one-time-yomtov-headline.yml
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add -A
          git commit -m "Switch homepage table wording automatically for Yom Tov"
          git push
