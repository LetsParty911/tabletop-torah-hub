name: Prepare approved Mi Kaamcha logo
on:
  push:
    branches:
      - update-mi-kaamcha-logo
    paths:
      - .github/workflows/prepare-mi-kaamcha-logo.yml
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch public Toldos edition and verify exact approved PDF
        run: |
          curl --fail --location --retry 2 --max-time 60 --output /tmp/approved-toldos.pdf 'https://torahforthetable.com/view/f33e7106-00d3-414a-bb64-0b6f0f4786a1/pdf'
          echo '9befe7951d0ab7243ef6b1d56c986c7a282116c40ed868014aa9080d45079546  /tmp/approved-toldos.pdf' | sha256sum --check
      - name: Extract the original logo and generate web sizes
        run: |
          python -m pip install --disable-pip-version-check pymupdf pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import fitz, io
          pdf = fitz.open('/tmp/approved-toldos.pdf')
          images = pdf[0].get_images(full=True)
          logo = next(im for im in images if im[0] == 39 and im[1] == 40 and im[2:4] == (1254,1254))
          assert len(pdf[0].get_image_rects(logo[0])) == 1
          pix = fitz.Pixmap(fitz.Pixmap(pdf, logo[0]), fitz.Pixmap(pdf, logo[1]))
          original = Image.open(io.BytesIO(pix.tobytes('png'))).convert('RGBA')
          out = Path('public/publication-covers')
          for size, name, quality in [(512, 'mi-kaamcha-yisroel-logo-v1.webp', 88), (240, 'mi-kaamcha-yisroel-logo-small-v1.webp', 75)]:
              resized = original.resize((size,size), Image.Resampling.LANCZOS)
              resized.save(out / name, quality=quality, method=6)
              assert Image.open(out / name).size == (size,size)
          # Keep earlier paths usable for old cached clients, with the new artwork.
          full = original.resize((512,512), Image.Resampling.LANCZOS)
          background = Image.new('RGBA', full.size, 'white')
          Image.alpha_composite(background,full).convert('RGB').save(out / 'mi-kaamcha-yisroel-permanent.jpg',quality=88,optimize=True)
          original.resize((240,240), Image.Resampling.LANCZOS).save(out / 'mi-kaamcha-yisroel-small.webp',quality=75,method=6)
          # Update every active reference and its tests; preserve all publication IDs.
          for path in Path('src').rglob('*'):
              if path.is_file() and path.suffix in ('.ts','.tsx','.js','.jsx','.json'):
                  old = path.read_text(encoding='utf-8')
                  new = old.replace('/publication-covers/mi-kaamcha-yisroel-permanent.jpg','/publication-covers/mi-kaamcha-yisroel-logo-v1.webp').replace('/publication-covers/mi-kaamcha-yisroel-small.webp','/publication-covers/mi-kaamcha-yisroel-logo-small-v1.webp')
                  if new != old:
                      path.write_text(new,encoding='utf-8')
          PY
      - name: Commit only approved logo assets and reference changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/publication-covers/mi-kaamcha-yisroel-* src
          git diff --cached --stat
          git commit -m "Use original Mi Kaamcha Yisroel logo for permanent publication cover"
          git push origin HEAD:refs/heads/update-mi-kaamcha-logo
