name: Apply seasonal homepage polish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-seasonal-homepage-polish.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply seasonal homepage polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply homepage and seasonal UX changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Homepage: calendar-first hero, fallback strip, Yom Kippur notice,
          # current-week progress context, and long-study labeling.
          p = Path('src/routes/index.tsx')
          s = p.read_text()

          old = '''  const displayedLabel = isFallback && fallbackParshaLabel ? fallbackParshaLabel : currentLabel;\n  const displayedParshaKey = isFallback && fallbackParshaKey ? fallbackParshaKey : currentParshaKey;\n'''
          new = '''  const displayedLabel = isFallback && fallbackParshaLabel ? fallbackParshaLabel : currentLabel;\n  const displayedParshaKey = isFallback && fallbackParshaKey ? fallbackParshaKey : currentParshaKey;\n  const normalizedCurrentKey = (currentParshaKey ?? currentLabel)\n    .replace(/^Parshas\\s+/i, "")\n    .trim()\n    .toLowerCase();\n  const easternToday = new Date().toLocaleDateString("en-CA", { timeZone: "America/New_York" });\n  const showYomKippurNotice = easternToday >= "2026-09-15" && easternToday <= "2026-09-20";\n  const shabbatShuvaLabel =\n    isFallback && normalizedCurrentKey === "ha'azinu" && showYomKippurNotice\n      ? `Shabbat Shuva / ${currentLabel}`\n      : currentLabel;\n'''
          if old not in s: raise SystemExit('index current-label anchor not found')
          s = s.replace(old, new, 1)

          old = '''  const pdfParams = (r: Resource) => ({\n    file_id: r.id,\n    file_title: r.title,\n    source_name: r.title,\n    parsha: displayedParshaKey ?? undefined,\n  });\n'''
          new = '''  const pdfParams = (r: Resource) => ({\n    file_id: r.id,\n    file_title: r.title,\n    source_name: r.title,\n    parsha: displayedParshaKey ?? undefined,\n  });\n\n  const pageCountLabel = (r: Resource) => {\n    if (typeof r.page_count !== "number") return null;\n    const pages = `${r.page_count} ${r.page_count === 1 ? "page" : "pages"}`;\n    return r.page_count >= 20 ? `Long Study · ${pages}` : pages;\n  };\n'''
          if old not in s: raise SystemExit('index pdfParams anchor not found')
          s = s.replace(old, new, 1)

          old = '''            <h1 className="mt-2 font-serif text-[2rem] leading-[1.08] sm:text-4xl md:text-5xl font-bold tracking-tight text-primary">\n              {postShabbos\n                ? `Divrei Torah for ${displayedLabel}`\n                : `Free Divrei Torah for Your ${isYomTovCollection ? "Yom Tov" : "Shabbos"} Table`}\n            </h1>\n            <p className="mx-auto mt-3 max-w-2xl font-serif text-base leading-relaxed text-primary sm:text-lg md:text-xl">\n              <span className="font-semibold">\n                {resources.length} {resources.length === 1 ? "selection" : "selections"}\n              </span>{" "}\n              {postShabbos ? (\n                <>\n                  still available to download{" "}\n                  <a\n                    href="#filters"\n                    onClick={(e) => {\n                      e.preventDefault();\n                      document.getElementById("filters")?.scrollIntoView({ behavior: "smooth", block: "start" });\n                    }}\n                    className="text-inherit no-underline"\n                  >\n                    below\n                  </a>\n                </>\n              ) : (\n                `for ${displayedLabel}`\n              )}\n            </p>\n'''
          new = '''            <h1 className="mt-2 font-serif text-[2rem] leading-[1.08] sm:text-4xl md:text-5xl font-bold tracking-tight text-primary">\n              {isFallback\n                ? shabbatShuvaLabel\n                : postShabbos\n                  ? `Divrei Torah for ${displayedLabel}`\n                  : `Free Divrei Torah for Your ${isYomTovCollection ? "Yom Tov" : "Shabbos"} Table`}\n            </h1>\n            <p className="mx-auto mt-3 max-w-2xl font-serif text-base leading-relaxed text-primary sm:text-lg md:text-xl">\n              {isFallback ? (\n                <>New Divrei Torah for this Shabbos are being prepared.</>\n              ) : (\n                <>\n                  <span className="font-semibold">\n                    {resources.length} {resources.length === 1 ? "selection" : "selections"}\n                  </span>{" "}\n                  {postShabbos ? "still available to download below" : `for ${displayedLabel}`}\n                </>\n              )}\n            </p>\n'''
          if old not in s: raise SystemExit('index hero anchor not found')
          s = s.replace(old, new, 1)

          old = '''              >\n                Browse {displayedLabel}\n              </a>\n'''
          new = '''              >\n                {isFallback ? `Browse ${displayedLabel} collection` : `See this week's PDFs`}\n              </a>\n'''
          if old not in s: raise SystemExit('index browse CTA anchor not found')
          s = s.replace(old, new, 1)

          old = '''        <ThursdayProgressMeter\n          heading={upcomingLabel ? `Upcoming: ${upcomingLabel}` : "Upcoming Divrei Torah"}\n          message="New Divrei Torah will be added then."\n          completeHref="#this-weeks-collection"\n          completeCtaLabel={upcomingLabel ? `Browse ${upcomingLabel}` : "Browse the new collection"}\n          ariaLabel={(fillStep) =>\n            `${upcomingLabel ? `${upcomingLabel} upload` : "Upcoming Divrei Torah upload"} progress: ${fillStep}% complete`\n          }\n        />\n\n        <div className="mx-auto max-w-2xl rounded-xl border border-accent/40 bg-card/40 px-4 py-4 sm:px-5">\n'''
          new = '''        <ThursdayProgressMeter\n          heading={isFallback ? currentLabel : upcomingLabel ? `Upcoming: ${upcomingLabel}` : "Upcoming Divrei Torah"}\n          badgeLabel={isFallback ? "This Shabbos" : "Upcoming"}\n          message="New Divrei Torah will be added then."\n          completeHref="#this-weeks-collection"\n          completeCtaLabel={isFallback ? `See ${currentLabel} PDFs` : upcomingLabel ? `Browse ${upcomingLabel}` : "Browse the new collection"}\n          ariaLabel={(fillStep) =>\n            `${isFallback ? `${currentLabel} upload` : upcomingLabel ? `${upcomingLabel} upload` : "Upcoming Divrei Torah upload"} progress: ${fillStep}% complete`\n          }\n        />\n\n        {showYomKippurNotice && (\n          <section className="mx-auto max-w-md rounded-xl border border-accent/40 bg-card/40 px-4 py-4 text-center sm:px-5">\n            <p className="font-sans text-[0.65rem] font-bold uppercase tracking-[0.18em] text-accent-readable">Coming next</p>\n            <h2 className="mt-1 font-serif text-xl font-bold text-primary sm:text-2xl">Yom Kippur</h2>\n            <p className="mt-2 text-sm leading-relaxed text-muted-foreground">\n              Yom Kippur materials are being prepared now. New PDFs will be posted ahead of Yom Tov.\n            </p>\n          </section>\n        )}\n\n        {isFallback && (\n          <div className="mx-auto max-w-2xl rounded-xl border border-accent/30 bg-accent/5 px-4 py-3 text-center">\n            <p className="font-serif text-sm text-primary sm:text-base">\n              <span className="font-semibold">{displayedLabel} collection still available</span> — {resources.length} {resources.length === 1 ? "selection" : "selections"}.\n            </p>\n          </div>\n        )}\n\n        <div className="mx-auto max-w-2xl rounded-xl border border-accent/40 bg-card/40 px-4 py-4 sm:px-5">\n'''
          if old not in s: raise SystemExit('index progress anchor not found')
          s = s.replace(old, new, 1)

          old = '''            {!postShabbos && (\n              <h2 className="font-serif text-2xl sm:text-3xl md:text-4xl font-bold text-primary text-center">\n                This Week's Collection\n              </h2>\n            )}\n'''
          new = '''            <h2 className="font-serif text-2xl sm:text-3xl md:text-4xl font-bold text-primary text-center">\n              {isFallback ? `${displayedLabel} Collection — Still Available` : "This Week's Collection"}\n            </h2>\n'''
          if old not in s: raise SystemExit('index collection heading anchor not found')
          s = s.replace(old, new, 1)

          old = '''                            {typeof r.page_count === "number" && (\n                              <p className="mt-2 text-xs font-medium uppercase tracking-wide text-muted-foreground">\n                                {r.page_count} {r.page_count === 1 ? "page" : "pages"}\n                              </p>\n                            )}\n'''
          new = '''                            {pageCountLabel(r) && (\n                              <p className="mt-2 text-xs font-medium uppercase tracking-wide text-muted-foreground">\n                                {pageCountLabel(r)}\n                              </p>\n                            )}\n'''
          if old not in s: raise SystemExit('index featured page count anchor not found')
          s = s.replace(old, new, 1)

          old = '''                                typeof r.page_count === "number"\n                                  ? `${r.page_count} ${r.page_count === 1 ? "page" : "pages"}`\n                                  : null,\n'''
          new = '''                                pageCountLabel(r),\n'''
          if old not in s: raise SystemExit('index card page count anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Short Vorts: don't present an empty current week as "0 vorts".
          p = Path('src/routes/short-vorts.tsx')
          s = p.read_text()
          old = '''            <span className="text-xs font-medium uppercase tracking-wide text-muted-foreground">\n              {vorts.length} {vorts.length === 1 ? "vort" : "vorts"}\n            </span>\n'''
          new = '''            <span className="text-xs font-medium uppercase tracking-wide text-muted-foreground">\n              {vorts.length > 0 ? `${vorts.length} ${vorts.length === 1 ? "vort" : "vorts"}` : "Preparing"}\n            </span>\n'''
          if old not in s: raise SystemExit('short-vorts count anchor not found')
          s = s.replace(old, new, 1)
          old = '''      heading: isYomTov ? label : `This Week — ${label}`,\n'''
          new = '''      heading: current.length > 0 ? (isYomTov ? label : `This Week — ${label}`) : `${label} — In preparation`,\n'''
          if old not in s: raise SystemExit('short-vorts heading anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # View page: never prefix Yom Tov with "Parshas" and flag long study PDFs.
          p = Path('src/routes/view.$id.tsx')
          s = p.read_text()
          old = '''import { formatTypeLabel } from "@/lib/format-labels";\n'''
          new = '''import { formatTypeLabel } from "@/lib/format-labels";\nimport { formatReadingLabel } from "@/lib/parshiyos";\n'''
          if old not in s: raise SystemExit('view import anchor not found')
          s = s.replace(old, new, 1)
          old = '''    const parshaLabel = rawParsha\n      ? /^(parshas|parashat)\\s/i.test(rawParsha)\n        ? rawParsha\n        : `Parshas ${rawParsha}`\n      : null;\n'''
          new = '''    const parshaLabel = rawParsha\n      ? formatReadingLabel(rawParsha.replace(/^(parshas|parashat)\\s+/i, "").trim())\n      : null;\n'''
          if old not in s: raise SystemExit('view parsha label anchor not found')
          s = s.replace(old, new, 1)
          old = '''    typeof pdf.page_count === "number"\n      ? `${pdf.page_count} ${pdf.page_count === 1 ? "page" : "pages"}`\n      : null,\n'''
          new = '''    typeof pdf.page_count === "number"\n      ? pdf.page_count >= 20\n        ? `Long Study · ${pdf.page_count} pages`\n        : `${pdf.page_count} ${pdf.page_count === 1 ? "page" : "pages"}`\n      : null,\n'''
          if old not in s: raise SystemExit('view page count anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Commit seasonal polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx src/routes/short-vorts.tsx 'src/routes/view.$id.tsx'
          git commit -m "Make homepage calendar-first for Aseres Yemei Teshuvah" || exit 0
          git push
