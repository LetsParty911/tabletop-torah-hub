name: Verify website reader-discovery improvements

on:
  pull_request:
    paths:
      - "src/lib/page-title*"
      - "src/lib/table-chooser*"
      - "src/lib/publication-description*"
      - "src/lib/collection-status*"
      - "src/routes/archive.tsx"
      - "src/lib/pdf-display-title*.ts"
      - "src/integrations/supabase/api.functions.ts"
      - "src/integrations/supabase/archive-all.functions.ts"
      - "src/lib/verified-thumbnails*.ts"
      - "src/pwa-register*.ts"
      - "src/routes/sitemap[.]xml.ts"
      - "src/lib/sitemap-lastmod*.ts"
      - "src/lib/public-label-sizing.test.ts"
      - "src/components/CategoryBadge.tsx"
      - "src/components/WhatsNewBanner.tsx"
      - "src/components/TableChooser.tsx"
      - "src/routes/publication.$slug.tsx"
      - "src/routes/publications.tsx"
      - "src/routes/short-vorts.tsx"
      - "src/routes/view.$id.tsx"
      - "src/routes/index.tsx"
      - "src/tests/homepage.smoke.test.tsx"
      - "src/components/UpdateCountdown.tsx"
      - "src/components/UpdateCountdown.test.tsx"
      - "src/components/WeeklyEmailSignup.test.tsx"
      - "src/lib/sender.server.ts"
      - "src/lib/sender.server.test.ts"
      - "vitest.signup.config.ts"
      - ".github/workflows/verify-website-improvements.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run relevant regression tests
        shell: bash
        run: |
          tests=()
          for file in src/lib/page-title.test.ts src/lib/table-chooser.starter.test.ts src/lib/collection-status.test.ts src/lib/publication-description.test.ts; do
            if [[ -f "$file" ]]; then tests+=("$file"); fi
          done
          if (( ${#tests[@]} == 0 )); then
            echo "No regression test files found"
            exit 1
          fi
          bun test "${tests[@]}"
      - name: Verify immutable thumbnail inventory and URL fallbacks
        run: bunx vitest run --config vitest.ux.config.ts src/lib/verified-thumbnails.test.ts
      - name: Verify accepted mobile typography improvements
        run: bunx vitest run --config vitest.ux.config.ts src/lib/public-label-sizing.test.ts
      - name: Verify sitemap modification dates
        run: bunx vitest run --config vitest.ux.config.ts src/lib/sitemap-lastmod.test.ts
      - name: Verify emergency PWA cache reset
        run: bunx vitest run --config vitest.ux.config.ts src/pwa-register.test.ts
      - name: Verify individual PDF titles
        run: bunx vitest run --config vitest.ux.config.ts src/lib/pdf-display-title.test.ts
      - name: Run signup and countdown regression tests
        run: bun run test:signup
      - name: Verify maintenance, VPN and IP classification safeguards
        run: bunx vitest run src/lib/maintenance.test.ts src/lib/vpn-block.test.ts src/lib/ip-geo.test.ts
      - name: Run isolated homepage interaction smoke tests
        run: bunx vitest run --config vitest.signup.config.ts src/tests/homepage.smoke.test.tsx
      - name: Build application
        run: bun run build
