name: Verify website reader-discovery improvements

on:
  pull_request:
    paths:
      - "src/lib/page-title*"
      - "src/lib/table-chooser*"
      - "src/lib/publication-description*"
      - "src/lib/collection-status*"
      - "src/routes/archive.tsx"
      - "src/routes/__root.tsx"
      - "src/routes/contact.tsx"
      - "src/routes/hidden-gems.tsx"
      - "src/routes/noahide-resources.tsx"
      - "src/routes/divrei-torah-parsha.tsx"
      - "src/routes/parsha.$slug.tsx"
      - "src/routes/brief-insights.tsx"
      - "src/integrations/supabase/parsha-seo.functions.ts"
      - "src/integrations/supabase/reading-pages.functions.ts"
      - "src/lib/reading-library*.ts"
      - "src/lib/audience.ts"
      - "src/components/HeaderSearchToggle*.tsx"
      - "src/components/SharePublicationButton.tsx"
      - "src/components/BackToTop.tsx"
      - "src/components/WeeklyEmailSignup.tsx"
      - "src/lib/pdf-display-title*.ts"
      - "src/integrations/supabase/api.functions.ts"
      - "src/integrations/supabase/archive-all.functions.ts"
      - "src/lib/verified-thumbnails*.ts"
      - "src/pwa-register*.ts"
      - "src/routes/sitemap*.ts"
      - "src/lib/sitemap-lastmod*.ts"
      - "src/lib/publication-slug*.ts"
      - "src/integrations/supabase/publication-pages.functions.ts"
      - "src/integrations/supabase/item-page.functions.ts"
      - "src/routes/resources.tsx"
      - "src/lib/public-label-sizing.test.ts"
      - "src/lib/public-filter-styles*.ts"
      - "src/lib/publication-thumbnail-fit.test.ts"
      - "src/routes/publications.tsx"
      - "src/components/CategoryBadge.tsx"
      - "src/components/WhatsNewBanner.tsx"
      - "src/components/TableChooser.tsx"
      - "src/routes/publication.$slug.tsx"
      - "src/routes/publications.tsx"
      - "src/routes/short-vorts.tsx"
      - "src/routes/view.$id.tsx"
      - "src/routes/index.tsx"
      - "src/routes/originals.tsx"
      - "src/lib/originals-promotion*.ts"
      - "src/lib/tftt-originals.ts"
      - "src/lib/original-upload-validation*.ts"
      - "src/lib/publication-quality*.ts"
      - "src/components/admin/UploadPdfForm.tsx"
      - "src/tests/admin-upload-form.test.tsx"
      - "src/components/OriginalSeriesCover*.tsx"
      - "src/components/PdfCoverThumbnail*.tsx"
      - "src/components/ReadingCollectionView.tsx"
      - "public/original-series-covers/**"
      - "src/components/admin/OriginalCoverManager*.tsx"
      - "src/lib/pdf-thumb.ts"
      - "src/routes/admin.tsx"
      - "vitest.ux.config.ts"
      - "src/tests/homepage.smoke.test.tsx"
      - "src/components/UpdateCountdown.tsx"
      - "src/components/UpdateCountdown.test.tsx"
      - "src/components/WeeklyEmailSignup.test.tsx"
      - "src/lib/sender.server.ts"
      - "src/lib/sender.server.test.ts"
      - "vitest.signup.config.ts"
      - ".github/workflows/verify-website-improvements.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run relevant regression tests
        shell: bash
        run: |
          tests=()
          for file in src/lib/page-title.test.ts src/lib/table-chooser.starter.test.ts src/lib/collection-status.test.ts src/lib/publication-description.test.ts; do
            if [[ -f "$file" ]]; then tests+=("$file"); fi
          done
          if (( ${#tests[@]} == 0 )); then
            echo "No regression test files found"
            exit 1
          fi
          bun test "${tests[@]}"
      - name: Verify immutable thumbnail inventory and URL fallbacks
        run: bunx vitest run --config vitest.ux.config.ts src/lib/verified-thumbnails.test.ts
      - name: Verify publication thumbnail fit
        run: bunx vitest run --config vitest.ux.config.ts src/lib/publication-thumbnail-fit.test.ts
      - name: Verify accepted mobile typography improvements
        run: bunx vitest run --config vitest.ux.config.ts src/lib/public-label-sizing.test.ts src/lib/public-filter-styles.test.ts
      - name: Verify sitemap modification dates
        run: bunx vitest run --config vitest.ux.config.ts src/lib/sitemap-lastmod.test.ts src/lib/publication-slug.test.ts
      - name: Verify emergency PWA cache reset
        run: bunx vitest run --config vitest.ux.config.ts src/pwa-register.test.ts
      - name: Verify individual PDF titles
        run: bunx vitest run --config vitest.ux.config.ts src/lib/pdf-display-title.test.ts
      - name: Run signup and countdown regression tests
        run: bun run test:signup
      - name: Verify maintenance, VPN and IP classification safeguards
        run: bunx vitest run src/lib/maintenance.test.ts src/lib/vpn-block.test.ts src/lib/ip-geo.test.ts
      - name: Run isolated homepage interaction smoke tests
        run: bunx vitest run --config vitest.signup.config.ts src/tests/homepage.smoke.test.tsx
      - name: Verify Originals catalog and real publication ownership
        run: bunx vitest run --config vitest.ux.config.ts src/lib/originals-promotion.test.ts src/lib/original-editions.test.ts src/lib/parsha-detective.test.ts src/lib/weekly-card-badges.test.ts src/lib/verified-thumbnails.server.test.ts src/components/admin/OriginalCoverManager.test.tsx src/components/PdfCoverThumbnail.test.tsx
      - name: Verify original upload identity and admin form
        run: bunx vitest run --config vitest.ux.config.ts src/lib/original-upload-validation.test.ts src/lib/publication-quality.test.ts src/tests/admin-upload-form.test.tsx
      - name: Verify complete reading library, audience defaults and accessible search
        run: bunx vitest run --config vitest.ux.config.ts src/lib/reading-library.test.ts src/lib/length-filter.test.ts src/components/HeaderSearchToggle.test.tsx
      - name: Build application
        run: bun run build
