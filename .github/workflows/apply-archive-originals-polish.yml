name: Apply archive and originals polish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-archive-originals-polish.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply archive and originals polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply archive and originals improvements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Archive: Yom Tov labels, Yamim Noraim shortcuts, long-study labels.
          p = Path('src/routes/archive.tsx')
          s = p.read_text()

          old = 'import { publicationLabel } from "@/lib/badges";\n'
          new = 'import { publicationLabel } from "@/lib/badges";\nimport { formatReadingLabel } from "@/lib/parshiyos";\n'
          if old not in s: raise SystemExit('archive import anchor not found')
          s = s.replace(old, new, 1)

          old = '''    const parshaLabel =\n      search.parsha !== "all"\n        ? /^(parshas|parashat)\\s/i.test(search.parsha)\n          ? search.parsha\n          : `Parshas ${search.parsha}`\n        : null;\n'''
          new = '''    const parshaLabel =\n      search.parsha !== "all"\n        ? formatReadingLabel(search.parsha.replace(/^(parshas|parashat)\\s+/i, "").trim())\n        : null;\n'''
          if old not in s: raise SystemExit('archive head label anchor not found')
          s = s.replace(old, new, 1)

          old = '''              <div className="grid gap-3 sm:gap-4 sm:grid-cols-[1fr_1fr_2fr] items-end">\n'''
          new = '''              <div className="mb-4 flex flex-col items-center gap-2 border-b border-accent/20 pb-4">\n                <span className="text-[0.65rem] font-semibold uppercase tracking-[0.18em] text-muted-foreground">\n                  Yamim Noraim\n                </span>\n                <div className="flex flex-wrap items-center justify-center gap-2">\n                  {["Rosh Hashanah", "Yom Kippur"].map((holiday) => {\n                    const active = parshaFilter === holiday;\n                    const available = allParshiyos.includes(holiday);\n                    return available ? (\n                      <button\n                        key={holiday}\n                        type="button"\n                        aria-pressed={active}\n                        onClick={() => setParshaFilter(active ? "all" : holiday)}\n                        className={`rounded-full border px-3.5 py-1.5 text-xs font-semibold transition-colors ${\n                          active\n                            ? "border-accent bg-accent text-accent-foreground"\n                            : "border-accent/40 bg-background/70 text-primary hover:bg-accent/10"\n                        }`}\n                      >\n                        {holiday}\n                      </button>\n                    ) : null;\n                  })}\n                </div>\n              </div>\n\n              <div className="grid gap-3 sm:gap-4 sm:grid-cols-[1fr_1fr_2fr] items-end">\n'''
          if old not in s: raise SystemExit('archive filters anchor not found')
          s = s.replace(old, new, 1)

          old = '''                        <h3 className="font-serif text-xl sm:text-2xl font-semibold text-primary mb-4">\n                          Parshas {p.parshaKey}\n                        </h3>\n'''
          new = '''                        <h3 className="font-serif text-xl sm:text-2xl font-semibold text-primary mb-4">\n                          {formatReadingLabel(p.parshaKey)}\n                        </h3>\n'''
          if old not in s: raise SystemExit('archive section heading anchor not found')
          s = s.replace(old, new, 1)

          old = '''                                        typeof r.page_count === "number"\n                                          ? `${r.page_count} ${r.page_count === 1 ? "page" : "pages"}`\n                                          : null,\n'''
          new = '''                                        typeof r.page_count === "number"\n                                          ? r.page_count >= 20\n                                            ? `Long Study · ${r.page_count} pages`\n                                            : `${r.page_count} ${r.page_count === 1 ? "page" : "pages"}`\n                                          : null,\n'''
          if old not in s: raise SystemExit('archive page-count anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Originals: make each series feel like a product, not an index entry.
          p = Path('src/routes/resources.tsx')
          s = p.read_text()
          s = s.replace('''type SeriesCard = {\n  title: string;\n  description: string;\n  linkTo: string;\n''','''type SeriesCard = {\n  title: string;\n  description: string;\n  sample: string;\n  linkTo: string;\n''',1)

          replacements = [
            ('''    description:\n      "Brief, focused divrei Torah written in-house each week. Each vort is drawn from a classical source — Rashi, Midrash, or Chazal — and rewritten in a few sentences so it can be said over at the table without preparation.",\n    linkTo:''','''    description:\n      "Brief, focused divrei Torah written in-house each week. Each vort is drawn from a classical source — Rashi, Midrash, or Chazal — and rewritten in a few sentences so it can be said over at the table without preparation.",\n    sample: "What to expect: one source, one clear idea, about a minute to say over.",\n    linkTo:'''),
            ('''    description:\n      "Source-based stories from Chazal and Tanach, retold for the table. Each story opens with the original Hebrew source and its translation, followed by a plain-English retelling and a “For the Table” discussion question that draws everyone into the conversation.",\n    linkTo:''','''    description:\n      "Source-based stories from Chazal and Tanach, retold for the table. Each story opens with the original Hebrew source and its translation, followed by a plain-English retelling and a “For the Table” discussion question that draws everyone into the conversation.",\n    sample: "What to expect: source, translation, story, and one discussion question.",\n    linkTo:'''),
            ('''    description:\n      "A weekly piece that uses parashah insights to discuss communication and positive speech. Each installment takes a moment from the parsha where words shape an outcome — a blessing, a rebuke, a report — and draws out a practical point about how we speak to family, friends, and neighbors.",\n    linkTo:''','''    description:\n      "A weekly piece that uses parashah insights to discuss communication and positive speech. Each installment takes a moment from the parsha where words shape an outcome — a blessing, a rebuke, a report — and draws out a practical point about how we speak to family, friends, and neighbors.",\n    sample: "What to expect: a parsha moment connected to practical speech and relationships.",\n    linkTo:'''),
            ('''    title: "Parsha Questions & Answers",\n    description:\n      "Source-based questions and answers on the parsha each week, written for learning together at the table. Every set is accompanied by a Kids' Corner page with riddles and picture puzzles so younger children have their own way in.",\n    linkTo: "/archive",\n    linkSearch: { q: "Parsha Questions" },\n    cta: "Browse Parsha Questions & Answers →",\n''','''    title: "Parsha Q&A",\n    description:\n      "Source-based questions and answers on the parsha each week, written for learning together at the table. Every set is accompanied by a Kids' Corner page with riddles and picture puzzles so younger children have their own way in.",\n    sample: "What to expect: table-ready questions, answers, plus a Kids' Corner.",\n    linkTo: "/archive",\n    linkSearch: { q: "Parsha Q&A" },\n    cta: "Browse Parsha Q&A →",\n'''),
          ]
          for old, new in replacements:
            if old not in s: raise SystemExit('resources series anchor not found')
            s = s.replace(old, new, 1)

          old = '''                  <p className="mt-2 flex-1 font-serif text-sm sm:text-base leading-relaxed text-foreground">\n                    {s.description}\n                  </p>\n                  <p className="mt-4 text-sm sm:text-base">\n'''
          new = '''                  <p className="mt-2 font-serif text-sm sm:text-base leading-relaxed text-foreground">\n                    {s.description}\n                  </p>\n                  <p className="mt-3 flex-1 rounded-lg border border-accent/20 bg-background/50 px-3 py-2 text-xs sm:text-sm text-muted-foreground">\n                    {s.sample}\n                  </p>\n                  <p className="mt-4 text-sm sm:text-base">\n'''
          if old not in s: raise SystemExit('resources card render anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Commit archive and originals changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/archive.tsx src/routes/resources.tsx
          git commit -m "Polish archive and Originals for Yom Tov browsing" || exit 0
          git push
