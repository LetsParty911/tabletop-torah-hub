name: Verify parsha rollover

on:
  push:
    branches:
      - fix/automatic-motzei-shabbos-parsha-20261010
  pull_request:
    paths:
      - src/lib/hebcal.ts
      - src/lib/hebcal.test.ts
      - .github/workflows/verify-parsha-rollover.yml

permissions:
  contents: read

jobs:
  hebcal-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run Hebcal regression tests
        run: bun test src/lib/hebcal.test.ts
