name: Verify mobile return navigation

on:
  pull_request:
    paths:
      - "src/components/BackToTop.tsx"
      - "src/components/BackToTop.test.tsx"
      - "vitest.ux.config.ts"
      - ".github/workflows/verify-mobile-navigation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify mobile and desktop return controls
        run: bunx vitest run --config vitest.ux.config.ts src/components/BackToTop.test.tsx
