name: Verify site release marker

on:
  pull_request:
    paths:
      - "src/routes/api/site-version.ts"
      - ".github/workflows/verify-site-version.yml"

permissions:
  contents: read

jobs:
  site-version-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build production site
        run: bun run build
