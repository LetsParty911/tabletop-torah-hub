name: Maintenance lockfile and TanStack cleanup

on:
  push:
    branches: [maintenance-lockfile-tanstack-bundle]
    paths:
      - '.github/workflows/maintenance-lockfile-tanstack-bundle.yml'

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace deprecated inputValidator calls
        shell: bash
        run: |
          grep -RIl --include='*.ts' --include='*.tsx' 'inputValidator(' src | xargs -r sed -i 's/\.inputValidator(/.validator(/g'

      - name: Refresh npm lockfile
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Verify clean install
        run: npm ci --no-audit --no-fund

      - name: Verify deprecated calls are gone
        shell: bash
        run: |
          if grep -RIn --include='*.ts' --include='*.tsx' 'inputValidator(' src; then
            echo 'Deprecated inputValidator calls remain.'
            exit 1
          fi

      - name: Build production bundle
        run: npm run build

      - name: Report largest client chunks
        shell: bash
        run: |
          echo 'Largest client JavaScript assets:'
          find .output/public/assets -maxdepth 1 -type f -name '*.js' -printf '%s %f\n' | sort -nr | head -20

      - name: Commit maintenance changes
        shell: bash
        run: |
          rm .github/workflows/maintenance-lockfile-tanstack-bundle.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refresh lockfile and update TanStack validators'
          git push origin HEAD:maintenance-lockfile-tanstack-bundle
