name: Verify visitor-local Shabbos closure

on:
  push:
    branches:
      - "feat/visitor-local-shabbos-yomtov-closure-20261020"
  pull_request:
    paths:
      - "src/lib/shabbos-gate*"
      - "src/start.ts"
      - ".github/workflows/verify-shabbos-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Run Shabbos, maintenance, VPN and geolocation tests
        run: bunx vitest run src/lib/shabbos-gate.test.ts src/lib/maintenance.test.ts src/lib/vpn-block.test.ts src/lib/ip-geo.test.ts
      - name: Build site
        run: bun run build
