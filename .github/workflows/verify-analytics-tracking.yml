name: Verify analytics tracking changes

on:
  pull_request:
    paths:
      - "src/lib/human-sessions.ts"
      - "src/lib/human-sessions.test.ts"
      - "src/lib/maintenance-traffic*"
      - "src/lib/visitor-alert*"
      - "src/components/admin/MaintenanceTrafficSection.tsx"
      - "docs/visitor-alert-fix/**"
      - ".github/workflows/verify-analytics-tracking.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analytics-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run targeted tracking regressions
        run: bun test src/lib/human-sessions.test.ts src/lib/traffic-confidence.test.ts src/lib/maintenance-traffic.test.ts src/lib/visitor-alert.test.ts
