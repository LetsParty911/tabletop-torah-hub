name: Verify permanent Parsha and Yom Tov directory

on:
  pull_request:
    paths:
      - "src/lib/parsha-directory*"
      - "src/lib/parshiyos.ts"
      - "src/lib/reading-page.ts"
      - "src/integrations/supabase/parsha-seo.functions.ts"
      - "src/routes/divrei-torah-parsha.tsx"
      - "src/routes/parsha.$slug.tsx"
      - "src/routes/sitemap[.]xml.ts"
      - ".github/workflows/verify-parsha-directory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Test all permanent reading and holiday slugs
        run: bun test src/lib/parsha-directory.test.ts
      - name: Build without server credentials
        run: bun run build
