name: Verify Parsha directory

on:
  pull_request:
    paths:
      - "src/lib/parsha-directory*"
      - "src/lib/parshiyos.ts"
      - "src/lib/reading-page.ts"
      - "src/integrations/supabase/parsha-seo.functions.ts"
      - "src/routes/divrei-torah-parsha.tsx"
      - "src/routes/parsha.$slug.tsx"
      - "src/routes/sitemap*"
      - ".github/workflows/verify-parsha-directory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  directory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test permanent reading routes
        run: npx vitest run src/lib/parsha-directory.test.ts
      - name: Build application
        run: npm run build
