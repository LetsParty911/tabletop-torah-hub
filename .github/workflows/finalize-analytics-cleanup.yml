name: Finalize analytics cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-analytics-cleanup.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply remaining analytics edits
        run: python3 scripts/finalize_analytics_cleanup.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Restore lockfile
        run: git restore package-lock.json
      - name: Format changed analytics files
        run: npx prettier --write src/components/Phase1Funnel.tsx src/components/TrafficAnalytics.tsx src/components/Phase2ReturningAnalytics.tsx src/integrations/supabase/phase1-dashboard-v2.ts src/integrations/supabase/phase2-returning-analytics-v2.ts src/routes/api/events.ts src/routes/admin-analytics.tsx src/routes/privacy.tsx src/routes/about.tsx docs/analytics-event-schema.md supabase_analytics_events_migration.sql
      - name: Build
        run: npm run build
      - name: Lint focused analytics files
        run: npx eslint src/components/Phase1Funnel.tsx src/components/TrafficAnalytics.tsx src/components/Phase2ReturningAnalytics.tsx src/integrations/supabase/phase1-dashboard-v2.ts src/integrations/supabase/phase2-returning-analytics-v2.ts src/routes/api/events.ts src/routes/admin-analytics.tsx src/routes/privacy.tsx src/routes/about.tsx
      - name: Commit verified changes and remove temporary files
        run: |
          rm .github/workflows/finalize-analytics-cleanup.yml scripts/finalize_analytics_cleanup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish location analytics and admin dashboard cleanup"
          git push origin HEAD:main
