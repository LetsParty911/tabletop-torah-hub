name: Apply Yom Tov homepage headline fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Yom Tov detection
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/routes/index.tsx')
          s = p.read_text()
          old = '  const isYomTovCollection = ["Rosh Hashanah", "Yom Kippur", "Sukkos", "Shemini Atzeres", "Simchas Torah", "Pesach", "Shavuos"].includes(displayedLabel);'
          new = '''  const normalizedCollectionKey = (displayedParshaKey ?? displayedLabel)
    .replace(/^Parshas\\s+/i, "")
    .trim()
    .toLowerCase();
  const isYomTovCollection = [
    "rosh hashanah",
    "yom kippur",
    "sukkos",
    "shemini atzeres",
    "simchas torah",
    "pesach",
    "shavuos",
  ].includes(normalizedCollectionKey);'''
          if old not in s:
            raise SystemExit('Expected Yom Tov detection line not found')
          p.write_text(s.replace(old, new, 1))
      - name: Commit fix
        run: |
          rm .github/workflows/fix-yomtov-headline-now.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx .github/workflows/fix-yomtov-headline-now.yml
          git commit -m "Fix Yom Tov homepage headline detection"
          git push
