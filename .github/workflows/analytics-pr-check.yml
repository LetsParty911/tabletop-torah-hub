name: Analytics PR Check
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Lint changed analytics files
        run: npx eslint src/components/TrafficAnalytics.tsx src/components/Phase1Funnel.tsx src/components/Phase2ReturningAnalytics.tsx src/components/AdminMiniDashboard.tsx src/components/DownloadsDashboard.tsx src/components/DownloadsByMinute.tsx src/components/DownloadAnalytics.tsx src/integrations/supabase/admin-analytics-canonical.ts src/integrations/supabase/phase1-dashboard-v2.ts src/integrations/supabase/phase2-returning-analytics-v2.ts
