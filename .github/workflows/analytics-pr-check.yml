name: Analytics PR Check
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Auto-fix changed analytics files
        run: npx eslint --fix src/components/TrafficAnalytics.tsx src/components/Phase1Funnel.tsx src/components/Phase2ReturningAnalytics.tsx src/components/AdminMiniDashboard.tsx src/components/DownloadsDashboard.tsx src/components/DownloadsByMinute.tsx src/components/DownloadAnalytics.tsx src/integrations/supabase/admin-analytics-canonical.ts src/integrations/supabase/phase1-dashboard-v2.ts src/integrations/supabase/phase2-returning-analytics-v2.ts
      - name: Commit lint fixes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/TrafficAnalytics.tsx src/components/Phase1Funnel.tsx src/components/Phase2ReturningAnalytics.tsx src/components/AdminMiniDashboard.tsx src/components/DownloadsDashboard.tsx src/components/DownloadsByMinute.tsx src/components/DownloadAnalytics.tsx src/integrations/supabase/admin-analytics-canonical.ts src/integrations/supabase/phase1-dashboard-v2.ts src/integrations/supabase/phase2-returning-analytics-v2.ts
            git commit -m "Format analytics overhaul"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
      - run: npm run build
      - name: Lint changed analytics files
        run: npx eslint src/components/TrafficAnalytics.tsx src/components/Phase1Funnel.tsx src/components/Phase2ReturningAnalytics.tsx src/components/AdminMiniDashboard.tsx src/components/DownloadsDashboard.tsx src/components/DownloadsByMinute.tsx src/components/DownloadAnalytics.tsx src/integrations/supabase/admin-analytics-canonical.ts src/integrations/supabase/phase1-dashboard-v2.ts src/integrations/supabase/phase2-returning-analytics-v2.ts
