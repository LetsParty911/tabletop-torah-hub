name: Verify visitor alert cluster grouping
on:
  pull_request:
    paths:
      - "supabase/functions/visitor-alert/**"
      - ".github/workflows/verify-visitor-alert-cluster.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test supabase/functions/visitor-alert/cluster.test.ts
      - run: bun run build
