name: Apply homepage upcoming UX

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-upcoming-card-ux.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Finish homepage upcoming UX'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/routes/index.tsx')
          text = path.read_text()

          hero = '''            {resources.length > 0 && (
              <p className="mx-auto mt-2 max-w-xl font-sans text-sm leading-relaxed text-muted-foreground sm:text-base">
                More Divrei Torah for the upcoming Shabbos or Yom Tov will be added by Thursday evening. Please check back then.
              </p>
            )}

'''
          text = text.replace(hero, '', 1)

          old_meter = '''        <ThursdayProgressMeter
          heading={upcomingLabel ? `Upcoming: ${upcomingLabel}` : "Upcoming Divrei Torah"}
          ariaLabel={(fillStep) =>
            `${upcomingLabel ? `${upcomingLabel} upload` : "Upcoming Divrei Torah upload"} progress: ${fillStep}% complete`
          }
        />'''

          new_meter = '''        <ThursdayProgressMeter
          heading={upcomingLabel ? `Upcoming: ${upcomingLabel}` : "Upcoming Divrei Torah"}
          message="New Divrei Torah will be added then."
          ariaLabel={(fillStep) =>
            `${upcomingLabel ? `${upcomingLabel} upload` : "Upcoming Divrei Torah upload"} progress: ${fillStep}% complete`
          }
        />'''

          if old_meter not in text and 'message="New Divrei Torah will be added then."' not in text:
              raise SystemExit('Expected progress meter block not found')
          text = text.replace(old_meter, new_meter, 1)
          path.write_text(text)
          PY

      - name: Remove one-off workflow and commit
        shell: bash
        run: |
          rm .github/workflows/apply-upcoming-card-ux.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx .github/workflows/apply-upcoming-card-ux.yml
          git commit -m "Finish upcoming card zero-state UX"
          git push
